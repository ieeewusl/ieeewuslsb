<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="wieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78237D"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
  </defs>

  <!-- Emblem: Star/Flower of Empowerment -->
  <g transform="translate(20, 20)">
    <!-- Radiating Petals / Rays -->
    <g fill="url(#wieGrad)">
      <path d="M 60 15 C 68 35, 68 45, 60 60 C 52 45, 52 35, 60 15 Z"/>
      <path d="M 60 105 C 68 85, 68 75, 60 60 C 52 75, 52 85, 60 105 Z"/>
      <path d="M 15 60 C 35 68, 45 68, 60 60 C 45 52, 35 52, 15 60 Z"/>
      <path d="M 105 60 C 85 68, 75 68, 60 60 C 75 52, 85 52, 105 60 Z"/>
      
      <path d="M 28 28 C 45 42, 50 48, 60 60 C 48 50, 42 45, 28 28 Z" opacity="0.85"/>
      <path d="M 92 92 C 75 78, 70 72, 60 60 C 72 70, 78 75, 92 92 Z" opacity="0.85"/>
      <path d="M 92 28 C 78 45, 72 50, 60 60 C 70 48, 75 42, 92 28 Z" opacity="0.85"/>
      <path d="M 28 92 C 42 75, 48 70, 60 60 C 50 72, 45 78, 28 92 Z" opacity="0.85"/>
    </g>
    <!-- Central Ring -->
    <circle cx="60" cy="60" r="14" fill="#FFFFFF"/>
    <circle cx="60" cy="60" r="9" fill="#00629B"/>
  </g>

  <!-- Typography -->
  <g transform="translate(145, 42)">
    <!-- IEEE Brand mark -->
    <text x="0" y="24" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#00629B" letter-spacing="1.5">
      IEEE
    </text>
    <!-- WOMEN IN ENGINEERING -->
    <text x="0" y="55" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#78237D" letter-spacing="0.5">
      WOMEN IN
    </text>
    <text x="0" y="80" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#BE185D" letter-spacing="0.5">
      ENGINEERING
    </text>
    <text x="0" y="100" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#00629B" letter-spacing="1.2">
      AFFINITY GROUP
    </text>
  </g>
</svg>

